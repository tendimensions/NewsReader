workflows:
  # iOS Workflow
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m1
    max_build_duration: 60
    
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tendimensions.newsreader
      
      groups:
        # Create these groups in CodeMagic UI (Teams > Global variables and secrets)
        - ios_signing  # Contains CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, CM_PROVISIONING_PROFILE
        - firebase_credentials  # Contains FIREBASE_SERVICE_ACCOUNT, FIREBASE_IOS_APP_ID, FIREBASE_ANDROID_APP_ID, NOTIFICATION_EMAIL
      
      # vars:
        # NewsAPI.org API Key - set in CodeMagic UI as secure environment variable
        # NEWS_API_KEY: $NEWS_API_KEY
        
        # App Store Connect (for future releases)
        # APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        # APP_STORE_CONNECT_KEY_IDENTIFIER: $APP_STORE_CONNECT_KEY_IDENTIFIER
        # APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
        
      flutter: stable
      xcode: latest
      cocoapods: default
    
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
    
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      
      - name: Generate Hive adapters
        script: |
          dart run build_runner build --delete-conflicting-outputs
      
      - name: Flutter analyze
        script: |
          flutter analyze
      
      - name: Run tests
        script: |
          flutter test
        ignore_failure: false
      
      - name: Build iOS
        script: |
          flutter build ipa --release --export-method=ad-hoc
    
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        ios:
          app_id: $FIREBASE_IOS_APP_ID
          groups:
            - testers
            - internal
          
      email:
        recipients:
          - $NOTIFICATION_EMAIL
        notify:
          success: true
          failure: true

  # Android Workflow
  android-workflow:
    name: Android Build & Deploy
    instance_type: linux_x2
    max_build_duration: 60
    
    environment:
      # android_signing:
      #   - keystore_reference
      
      groups:
        # Create these groups in CodeMagic UI (Teams > Global variables and secrets)
        - firebase_credentials  # Contains FIREBASE_SERVICE_ACCOUNT, FIREBASE_IOS_APP_ID, FIREBASE_ANDROID_APP_ID, NOTIFICATION_EMAIL
        # - google_play  # For future Play Store releases
      
      vars:
        # Package name
        PACKAGE_NAME: "com.tendimensions.newsreader"
        
        # NewsAPI.org API Key - set in CodeMagic UI as secure environment variable
        # NEWS_API_KEY: $NEWS_API_KEY
        
      flutter: stable
      java: 17
    
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
    
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      
      - name: Generate Hive adapters
        script: |
          dart run build_runner build --delete-conflicting-outputs
      
      - name: Flutter analyze
        script: |
          flutter analyze
      
      - name: Run tests
        script: |
          flutter test
        ignore_failure: false
      
      - name: Build Android APK
        script: |
          flutter build apk --release
      
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release
    
    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/mapping.txt
      - flutter_drive.log
    
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - testers
            - internal
      
      email:
        recipients:
          - $NOTIFICATION_EMAIL
        notify:
          success: true
          failure: true

  # Development workflow - faster, no distribution
  dev-workflow:
    name: Dev Build (Quick Check)
    instance_type: linux_x2
    max_build_duration: 30
    
    environment:
      flutter: stable
      java: 17
    
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      
      - name: Generate Hive adapters
        script: |
          dart run build_runner build --delete-conflicting-outputs
      
      - name: Flutter analyze
        script: |
          flutter analyze
      
      - name: Run tests
        script: |
          flutter test
        ignore_failure: false
      
      - name: Build APK (debug)
        script: |
          flutter build apk --debug
    
    artifacts:
      - build/app/outputs/**/*.apk
    
    publishing:
      email:
        recipients:
          - $NOTIFICATION_EMAIL
        notify:
          success: false
          failure: true
