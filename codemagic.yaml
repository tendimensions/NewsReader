workflows:
  # iOS Workflow
  ios-workflow:
    name: iOS Build & Deploy
    instance_type: mac_mini_m1
    max_build_duration: 10

    environment:
      groups:
        # Create these groups in CodeMagic UI (Teams > Global variables and secrets)
        - firebase_credentials  # Contains FIREBASE_SERVICE_ACCOUNT, FIREBASE_IOS_APP_ID, FIREBASE_ANDROID_APP_ID, NOTIFICATION_EMAIL

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.tendimensions.newsreader

      # vars:
        # App Store Connect (for future releases)
        # APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        # APP_STORE_CONNECT_KEY_IDENTIFIER: $APP_STORE_CONNECT_KEY_IDENTIFIER
        # APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY

      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Generate Hive adapters
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test
        ignore_failure: false

      - name: Create release notes
        script: |
          echo "Build #$BUILD_NUMBER" > release_notes.txt
          echo "Branch: $CM_BRANCH" >> release_notes.txt
          echo "Commit: $(echo $CM_COMMIT | cut -c1-8)" >> release_notes.txt
          echo "" >> release_notes.txt

          if [ -f "CHANGELOG.md" ]; then
            echo "Latest Changes:" >> release_notes.txt
            echo "" >> release_notes.txt
            sed '/^---$/q' CHANGELOG.md | sed '$d' | tail -n +3 >> release_notes.txt
          else
            echo "No CHANGELOG.md found." >> release_notes.txt
          fi

          echo "" >> release_notes.txt
          echo "Built on: $(date)" >> release_notes.txt
          echo "--- release_notes.txt ---"
          cat release_notes.txt

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS
        script: |
          flutter build ipa --release --build-number=$BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        ios:
          app_id: $FIREBASE_IOS_APP_ID
          groups:
            - testers

      email:
        recipients:
          - $NOTIFICATION_EMAIL
        notify:
          success: true
          failure: true

  # Android Workflow
  android-workflow:
    name: Android Build & Deploy
    instance_type: linux_x2
    max_build_duration: 10
    
    environment:
      # android_signing:
      #   - keystore_reference
      
      groups:
        # Create these groups in CodeMagic UI (Teams > Global variables and secrets)
        - firebase_credentials  # Contains FIREBASE_SERVICE_ACCOUNT, FIREBASE_IOS_APP_ID, FIREBASE_ANDROID_APP_ID, NOTIFICATION_EMAIL
        # - google_play  # For future Play Store releases
      
      vars:
        # Package name
        PACKAGE_NAME: "com.tendimensions.newsreader"
        
        # NewsAPI.org API Key - set in CodeMagic UI as secure environment variable
        # NEWS_API_KEY: $NEWS_API_KEY
        
      flutter: stable
      java: 17
    
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'develop'
          include: true
          source: true
    
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Generate Hive adapters
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test
        ignore_failure: false

      - name: Create release notes
        script: |
          echo "Build #$BUILD_NUMBER" > release_notes.txt
          echo "Branch: $CM_BRANCH" >> release_notes.txt
          echo "Commit: $(echo $CM_COMMIT | cut -c1-8)" >> release_notes.txt
          echo "" >> release_notes.txt

          if [ -f "CHANGELOG.md" ]; then
            echo "Latest Changes:" >> release_notes.txt
            echo "" >> release_notes.txt
            sed '/^---$/q' CHANGELOG.md | sed '$d' | tail -n +3 >> release_notes.txt
          else
            echo "No CHANGELOG.md found." >> release_notes.txt
          fi

          echo "" >> release_notes.txt
          echo "Built on: $(date)" >> release_notes.txt
          echo "--- release_notes.txt ---"
          cat release_notes.txt

      - name: Build Android APK
        script: |
          flutter build apk --release --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - testers
      
      email:
        recipients:
          - $NOTIFICATION_EMAIL
        notify:
          success: true
          failure: true

